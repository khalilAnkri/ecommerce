# Neo4j for supply_chain_network.ipynb
# start: docker compose up -d   |   stop: docker compose down
services:
  neo4j:
    image: neo4j:5.26
    ports:
      - "7474:7474"   # Neo4j Browser: http://localhost:7474
      - "7687:7687"   # bolt, used by the notebook
    environment:
      NEO4J_AUTH: neo4j/supplychain-pw
